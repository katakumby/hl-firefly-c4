# Keep azure-stage.yaml beside this file. Configure variables and retention before activation.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
schedules:
  - cron: '0 2 * * *'
    displayName: Daily independent previews (UTC)
    branches:
      include: [main]
    always: true
parameters:
  - name: stage
    type: string
    default: previews
    values: [previews, source, plantuml, mermaid]
  - name: acquireImage
    type: boolean
    default: false
  - name: registryServiceConnection
    type: string
    default: architecture-registry
variables:
  architectureStage: $[ iif(eq(variables['Build.Reason'], 'Schedule'), 'previews', iif(eq(variables['Build.Reason'], 'Manual'), '${{ parameters.stage }}', 'source')) ]
pool:
  name: $(ARCHITECTURE_AGENT_POOL)
  demands:
    - Agent.OS -equals Linux
jobs:
  - template: azure-stage.yaml
    parameters:
      stage: source
      acquireImage: ${{ parameters.acquireImage }}
      registryServiceConnection: ${{ parameters.registryServiceConnection }}
  - job: Lookup
    condition: and(succeeded(), ne(variables['architectureStage'], 'source'))
    workspace:
      clean: all
    steps:
      - checkout: self
        path: s/architecture
        clean: true
        persistCredentials: false
      - ${{ if eq(parameters.acquireImage, true) }}:
        - task: Docker@2
          inputs:
            command: login
            containerRegistry: ${{ parameters.registryServiceConnection }}
      - bash: |
          set -euo pipefail
          if [ "${ACQUIRE_IMAGE,,}" = true ]; then docker pull "$ARCHITECTURE_BROWSER_IMAGE"; fi
          docker image inspect "$ARCHITECTURE_BROWSER_IMAGE" >/dev/null
          # Only provider lookup has network access; this step generates no diagrams.
          docker run --rm --pull never --network bridge --read-only --init \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges:true \
            --env AZURE_COLLECTION_URI --env AZURE_PROJECT_ID --env AZURE_DEFINITION_ID \
            --env ARCHITECTURE_SOURCE_REVISION --env AZURE_SOURCE_BRANCH --env SYSTEM_ACCESSTOKEN \
            --mount "type=bind,src=$PWD/ci,dst=/ci,readonly" \
            --entrypoint node "$ARCHITECTURE_BROWSER_IMAGE" /ci/select-azure-source-run.cjs
        name: lookup
        displayName: Find newest available source artifact for this commit
        workingDirectory: $(Pipeline.Workspace)/s/architecture
        env:
          ACQUIRE_IMAGE: ${{ parameters.acquireImage }}
          ARCHITECTURE_BROWSER_IMAGE: $(ARCHITECTURE_BROWSER_IMAGE)
          AZURE_COLLECTION_URI: $(System.CollectionUri)
          AZURE_PROJECT_ID: $(System.TeamProjectId)
          AZURE_DEFINITION_ID: $(System.DefinitionId)
          ARCHITECTURE_SOURCE_REVISION: $(Build.SourceVersion)
          AZURE_SOURCE_BRANCH: $(Build.SourceBranch)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - ${{ if eq(parameters.acquireImage, true) }}:
        - task: Docker@2
          condition: always()
          inputs:
            command: logout
            containerRegistry: ${{ parameters.registryServiceConnection }}
  - template: azure-stage.yaml
    parameters:
      stage: plantuml
      acquireImage: ${{ parameters.acquireImage }}
      registryServiceConnection: ${{ parameters.registryServiceConnection }}
  - template: azure-stage.yaml
    parameters:
      stage: mermaid
      acquireImage: ${{ parameters.acquireImage }}
      registryServiceConnection: ${{ parameters.registryServiceConnection }}
