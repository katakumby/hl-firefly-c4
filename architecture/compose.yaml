name: dlt-architecture
services:
  structurizr:
    image: structurizr/structurizr:${STRUCTURIZR_VERSION:?Use architecture/scripts/compose.ps1}-noble
    command: ["local"]
    ports:
      - "127.0.0.1:${STRUCTURIZR_PORT:-8080}:8080"
    volumes:
      - ${STRUCTURIZR_PREVIEW_DIR:?Use the Compose wrapper}:/usr/local/structurizr
    labels:
      com.dlt-architecture.root: ${ARCHITECTURE_ROOT}
      com.dlt-architecture.run: ${STRUCTURIZR_RUN}
    environment:
      STRUCTURIZR_EDITABLE: "false"
      STRUCTURIZR_AUTOSAVEINTERVAL: "0"
      STRUCTURIZR_WORKSPACE_MAXSIZE: "10MB"
  cli:
    image: structurizr/structurizr:${STRUCTURIZR_VERSION}-noble
    profiles: ["tools"]
    command: ["validate", "-workspace", "${STRUCTURIZR_DSL}"]
    volumes:
      - ../:/usr/local/structurizr:ro
      - ../build/architecture:/usr/local/structurizr/build/architecture
  export:
    image: structurizr/structurizr:${STRUCTURIZR_VERSION}-playwright
    profiles: ["tools"]
    command: ["export", "-workspace", "${STRUCTURIZR_JSON}", "-format", "svg", "-output", "${STRUCTURIZR_EXPORT_DIR}"]
    volumes:
      - ../:/usr/local/structurizr:ro
      - ../build/architecture:/usr/local/structurizr/build/architecture

