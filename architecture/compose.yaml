name: dlt-architecture
services:
  structurizr:
    image: structurizr/structurizr:2026.06.28-noble
    command: ["local"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../build/architecture/reference:/usr/local/structurizr
    environment:
      STRUCTURIZR_EDITABLE: "false"
      STRUCTURIZR_AUTOSAVEINTERVAL: "0"
      STRUCTURIZR_WORKSPACE_MAXSIZE: "10MB"
  cli:
    image: structurizr/structurizr:2026.06.28-noble
    profiles: ["tools"]
    command: ["validate", "-workspace", "architecture/workspace.dsl"]
    volumes:
      - ../:/usr/local/structurizr:ro
      - ../build/architecture:/usr/local/structurizr/build/architecture
  export:
    image: structurizr/structurizr:2026.06.28-playwright
    profiles: ["tools"]
    command: ["export", "-workspace", "build/architecture/reference/workspace.json", "-format", "svg", "-output", "build/architecture/reference/svg"]
    volumes:
      - ../:/usr/local/structurizr:ro
      - ../build/architecture:/usr/local/structurizr/build/architecture

