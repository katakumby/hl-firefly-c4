name: firefly-architecture
services:
  structurizr:
    image: structurizr/structurizr:2026.06.28-noble
    command: ["local"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./exports:/usr/local/structurizr
    environment:
      STRUCTURIZR_EDITABLE: "false"
      STRUCTURIZR_AUTOSAVEINTERVAL: "0"
      STRUCTURIZR_WORKSPACE_MAXSIZE: "10MB"
  cli:
    image: structurizr/structurizr:2026.06.28-noble
    profiles: ["tools"]
    volumes:
      - ./:/usr/local/structurizr
  export:
    image: structurizr/structurizr:2026.06.28-playwright
    profiles: ["tools"]
    command: ["export", "-workspace", "exports/workspace.json", "-format", "svg", "-output", "exports/svg"]
    volumes:
      - ./:/usr/local/structurizr

