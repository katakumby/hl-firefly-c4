# Copy to .github/workflows/architecture.yaml after configuring the repository variables.
name: Architecture
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  diagrams:
    # Example variable: ["self-hosted", "linux", "architecture"]
    runs-on: ${{ fromJSON(vars.ARCHITECTURE_RUNNER_LABELS) }}
    env:
      ARCHITECTURE_TOOLS_IMAGE: ${{ vars.ARCHITECTURE_TOOLS_IMAGE }}
      # "preloaded" (default) or "pull". Use an approved image digest.
      ARCHITECTURE_IMAGE_ACQUISITION: ${{ vars.ARCHITECTURE_IMAGE_ACQUISITION }}
      DOCKER_CONFIG: ${{ runner.temp }}/architecture-docker-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
        working-directory: architecture
    steps:
      - uses: actions/checkout@v6
        with:
          path: architecture
          clean: true
          persist-credentials: false
      - name: Acquire approved image
        env:
          REGISTRY: ${{ vars.ARCHITECTURE_REGISTRY }}
          REGISTRY_USER: ${{ secrets.ARCHITECTURE_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.ARCHITECTURE_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ARCHITECTURE_TOOLS_IMAGE:?Configure the approved tools image}"
          if [ "$ARCHITECTURE_IMAGE_ACQUISITION" = pull ]; then
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
            docker pull "$ARCHITECTURE_TOOLS_IMAGE"
          fi
          docker image inspect "$ARCHITECTURE_TOOLS_IMAGE" >/dev/null
      - name: Regressions and full offline build
        run: |
          set -euo pipefail
          mkdir -p build/.reports
          docker/run.sh test 2>&1 | tee build/.reports/tests.log
          docker/run.sh build
      - name: Package current artifacts
        if: success()
        env:
          ARCHITECTURE_ARTIFACT_DIR: ${{ runner.temp }}/architecture-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARCHITECTURE_ARTIFACT_DIR"
          docker/run.sh package
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architecture-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true # Only the allowlisted package; includes .reports.
          if-no-files-found: error
      - name: Package failure diagnostics
        if: failure()
        env:
          ARCHITECTURE_ARTIFACT_DIR: ${{ runner.temp }}/architecture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARCHITECTURE_ARTIFACT_DIR"
          if docker image inspect "$ARCHITECTURE_TOOLS_IMAGE" >/dev/null 2>&1; then
            docker/run.sh package --diagnostics
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: architecture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architecture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
